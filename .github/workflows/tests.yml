name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: pip install pygame pyflakes
      - name: Noms indéfinis (pyflakes)
        run: |
          cd cyberSnake
          ! python -m pyflakes *.py cybersnake.pygame | grep "undefined name '"
      - name: Tests unitaires
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Test de fumée (une partie dans chaque mode)
        run: |
          python tests/smoke_test.py 1 3000
          python tests/smoke_test.py 2 3000
